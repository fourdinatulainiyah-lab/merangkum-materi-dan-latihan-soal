<script>

/* =====================================================
   VARIABEL

let seluruhTeks = "";

let streamKamera = null;

let daftarSoal = [];

let jawabanPengguna = [];


/* =====================================================
   MENAMPILKAN NAMA FILE
===================================================== */

function tampilkanNamaFile() {

    const input =
        document.getElementById("fileMateri");

    const nama =
        document.getElementById("namaFile");


    if (input.files.length > 0) {

        nama.innerText =
            "📄 File dipilih: " +
            input.files[0].name;

        seluruhTeks = "";

    } else {

        nama.innerText =
            "Belum ada file yang dipilih.";

    }

}


/* =====================================================
   MEMBACA FILE
===================================================== */

async function bacaFile() {

    const input =
        document.getElementById("fileMateri");


    if (input.files.length === 0) {

        throw new Error(
            "Silakan upload materi terlebih dahulu."
        );

    }


    const file =
        input.files[0];

    const namaFile =
        file.name.toLowerCase();


    /* ================= PDF ================= */

    if (
        file.type === "application/pdf" ||
        namaFile.endsWith(".pdf")
    ) {

        const arrayBuffer =
            await file.arrayBuffer();

        const pdf =
            await pdfjsLib
                .getDocument({
                    data: arrayBuffer
                })
                .promise;


        let teks = "";


        for (
            let halaman = 1;
            halaman <= pdf.numPages;
            halaman++
        ) {

            const page =
                await pdf.getPage(halaman);

            const textContent =
                await page.getTextContent();


            const teksHalaman =
                textContent.items
                    .map(item => item.str)
                    .join(" ");


            teks +=
                teksHalaman + " ";

        }


        return teks;
    }


    /* ================= WORD ================= */

    if (
        namaFile.endsWith(".docx")
    ) {

        const arrayBuffer =
            await file.arrayBuffer();


        const hasil =
            await mammoth.extractRawText({
                arrayBuffer: arrayBuffer
            });


        return hasil.value;
    }


    /* ================= GAMBAR ================= */

    if (
        file.type.startsWith("image/")
    ) {

        return await lakukanOCR(file);

    }


    throw new Error(
        "Format file tidak didukung."
    );

}


/* =====================================================
   OCR
===================================================== */

async function lakukanOCR(file) {

    const loading =
        document.getElementById("loading");


    loading.innerText =
        "🔎 Membaca teks dari gambar...";


    const hasil =
        await Tesseract.recognize(
            file,
            "ind",
            {

                logger: info => {

                    if (
                        info.status ===
                        "recognizing text"
                    ) {

                        const persen =
                            Math.round(
                                info.progress * 100
                            );


                        loading.innerText =
                            "🔎 Membaca gambar... " +
                            persen +
                            "%";

                    }

                }

            }
        );


    return hasil.data.text;

}


/* =====================================================
   RINGKAS MATERI
===================================================== */

async function ringkasMateri() {

    const format =
        document.getElementById(
            "format"
        ).value;


    const hasil =
        document.getElementById(
            "hasil"
        );


    const loading =
        document.getElementById(
            "loading"
        );


    loading.innerText =
        "📖 Membaca dan meringkas materi...";


    loading.style.display =
        "block";


    hasil.style.display =
        "none";


    try {

        if (
            !seluruhTeks.trim()
        ) {

            seluruhTeks =
                await bacaFile();

        }


        seluruhTeks =
            seluruhTeks
                .replace(/\s+/g, " ")
                .trim();


        if (
            !seluruhTeks
        ) {

            throw new Error(
                "Materi tidak memiliki teks yang dapat dibaca."
            );

        }


        const ringkasan =
            buatRingkasan(
                seluruhTeks,
                format
            );


        loading.style.display =
            "none";


        hasil.innerHTML =
            "<strong>📌 Hasil Ringkasan:</strong><br><br>" +
            ringkasan;


        hasil.style.display =
            "block";


    } catch (error) {

        loading.style.display =
            "none";


        alert(
            error.message
        );

    }

}


/* =====================================================
   FUNGSI RINGKASAN
===================================================== */

function buatRingkasan(
    teks,
    format
) {

    const kalimat =
        teks
            .split(/[.!?]+/)
            .map(
                k => k.trim()
            )
            .filter(
                k => k.length > 30
            );


    if (
        kalimat.length === 0
    ) {

        return "Materi terlalu pendek untuk diringkas.";

    }


    const jumlah =
        Math.min(
            7,
            kalimat.length
        );


    const penting =
        kalimat.slice(
            0,
            jumlah
        );


    /* POIN */

    if (
        format === "poin"
    ) {

        return penting
            .map(
                k => "• " + k + "."
            )
            .join(
                "<br><br>"
            );

    }


    /* PARAGRAF */

    if (
        format === "paragraf"
    ) {

        return penting
            .map(
                k => k + "."
            )
            .join(" ");

    }


    /* SANTAI */

    if (
        format === "santai"
    ) {

        return `
            <p>
                📖 Intinya, materi ini membahas:
            </p>

            ${penting
                .slice(0, 5)
                .map(
                    k => "• " + k
                )
                .join("<br><br>")
            }
        `;

    }

}


/* =====================================================
   MEMBUAT LATIHAN SOAL (Diperbarui agar bervariasi)

async function buatLatihanSoal() {

    const jumlah =
        parseInt(
            document.getElementById(
                "jumlahSoal"
            ).value
        );


    const jenis =
        document.getElementById(
            "jenisSoal"

    const hasilSoal =
        document.getElementById(
            "hasilSoal"
        );


    const loading =
        document.getElementById(
            "loading"
        );


    loading.innerText =
        "🧠 Sedang membuat latihan soal yang bervariasi...";


    loading.style.display =
        "block";


    hasilSoal.style.display =
        "none";


    try {

        if (
            !seluruhTeks.trim()
        ) {

            seluruhTeks =
                await bacaFile();

        }


        seluruhTeks =
            seluruhTeks
                .replace(/\s+/g, " ")
                .trim();


        const kalimat =
            seluruhTeks
                .split(/[.!?]+/)
                .map(
                    k => k.trim()
                )
                .filter(
                    k => k.length > 30
                );


        if (
            kalimat.length === 0
        ) {

            throw new Error(
                "Materi terlalu pendek untuk dibuat latihan soal."
            );

        }


        const jumlahSebenarnya =
            Math.min(
                jumlah,
                kalimat.length
            );


        daftarSoal = [];

        jawabanPengguna = [];


        for (
            let i = 0;
            i < jumlahSebenarnya;
            i++
        ) {

            const teksMateri = kalimat[i];

            if (
                jenis === "pilihan"
            ) {

                daftarSoal.push(
                    buatPilihanGanda(
                        teksMateri,
                        i
                    )
                );

            }

            else if (
                jenis === "benar"
            ) {

                daftarSoal.push(
                    buatBenarSalah(
                        teksMateri,
                        i
                    )
                );

            }

            else if (
                jenis === "isian"
            ) {

                daftarSoal.push(
                    buatIsian(
                        teksMateri,
                        i
                    )
                );

            }

        }


        loading.style.display =
            "none";


        tampilkanSoal();


    } catch (error) {

        loading.style.display =
            "none";


        alert(
            error.message
        );

    }

}


/* =====================================================
   PILIHAN GANDA (Variasi Pertanyaan dari Isi Materi)
===================================================== */

function buatPilihanGanda(
    kalimat,
    index
) {

    const kataKunci = ambilKataPenting(kalimat);
    
    const daftarPertanyaan = [
        `Apa inti dari pembahasan mengenai: "${kataKunci}"?`,
        `Berdasarkan isi teks, hal penting yang berkaitan dengan "${kataKunci}" adalah...`,
        `Pernyataan manakah yang paling tepat menjelaskan konsep tentang "${kataKunci}" di atas?`,
        `Dalam konteks materi tersebut, poin utama dari kalimat "${kalimat.slice(0, 40)}..." adalah...`
    ];

    const pertanyaanPilihan = daftarPertanyaan[index % daftarPertanyaan.length];

    const pilihanSalah = [
        `Konsep lain yang tidak dibahas dalam bab ini mengenai ${kataKunci}`,
        `Pernyataan yang bertentangan dengan fungsi utama ${kataKunci}`,
        `Kesimpulan keliru yang tidak sesuai dengan isi dokumen`
    ];


    let pilihan = [
        kalimat,
        ...pilihanSalah
    ];


    pilihan.sort(
        () =>
            Math.random() - 0.5
    );


    return {

        tipe: "pilihan",

        pertanyaan: pertanyaanPilihan,

        pilihan: pilihan,

        jawaban:
            pilihan.indexOf(
                kalimat
            ),

        penjelasan:
            `Penjelasan: Kalimat atau konsep yang benar sesuai materi adalah "${kalimat}".`

    };

}


/* =====================================================
   BENAR / SALAH (Variasi Pernyataan)
===================================================== */

function buatBenarSalah(
    kalimat,
    nomor
) {

    const benar =
        nomor % 2 === 0;

    const daftarTanyaBS = [
        "Tentukan apakah pernyataan berikut sesuai dengan isi materi:",
        "Apakah fakta berikut ini benar berdasarkan dokumen yang diunggah?",
        "Nilai kebenaran dari pernyataan berikut merujuk pada teks materi adalah:"
    ];

    const pertanyaanPilihan = daftarTanyaBS[nomor % daftarTanyaBS.length];


    return {

        tipe: "benar",

        pertanyaan: pertanyaanPilihan,

        pernyataan:
            benar
                ? kalimat
                : "Tidak benar bahwa " + kalimat.toLowerCase(),

        jawaban:
            benar
                ? "Benar"
                : "Salah",

        penjelasan:
            benar
                ? `Pernyataan ini valid dan termuat langsung di dalam materi.`
                : `Pernyataan ini tidak tepat karena bertolak belakang dengan isi materi.`

    };

}


/* =====================================================
   ISIAN (Variasi Titik-titik / Melengkapi)
===================================================== */

function buatIsian(
    kalimat,
    nomor
) {

    const kata = ambilKataPenting(kalimat);

    const daftarTanyaIsian = [
        "Lengkapi bagian rumpang pada kalimat materi berikut:",
        "Isilah kata atau frasa penting yang hilang dari materi berikut:",
        "Lengkapi kalimat di bawah ini agar sesuai dengan dokumen:"
    ];

    const pertanyaanPilihan = daftarTanyaIsian[nomor % daftarTanyaIsian.length];

    let teksRumpang = kalimat;
    if (kalimat.includes(kata)) {
        teksRumpang = kalimat.replace(kata, "__________");
    } else {
        const kataList = kalimat.split(" ");
        if(kataList.length > 2) {
            kataList[1] = "__________";
            teksRumpang = kataList.join(" ");
        }
    }


    return {

        tipe: "isian",

        pertanyaan: pertanyaanPilihan,

        teks: teksRumpang,

        jawaban:
            kata,

        penjelasan:
            `Kata kunci yang dicari untuk melengkapi kalimat tersebut adalah "${kata}".`

    };

}

/* =====================================================
   MEMERIKSA JAWABAN
===================================================== */

function periksaJawaban() {

    let benar = 0;

    let kosong = 0;


    jawabanPengguna = [];


    daftarSoal.forEach(
        (
            soal,
            index
        ) => {

            let jawabanUser =
                null;


            if (
                soal.tipe === "pilihan"
            ) {

                const pilihan =
                    document.querySelector(
                        `input[name="soal${index}"]:checked`
                    );


                if (pilihan) {

                    jawabanUser =
                        parseInt(
                            pilihan.value
                        );

                }

            }


            else if (
                soal.tipe === "benar"
            ) {

                const pilihan =
                    document.querySelector(
                        `input[name="soal${index}"]:checked`
                    );


                if (pilihan) {

                    jawabanUser =
                        pilihan.value;

                }

            }


            else if (
                soal.tipe === "isian"
            ) {

                const input =
                    document.getElementById(
                        `isian${index}`
                    );


                if (
                    input &&
                    input.value.trim()
                ) {

                    jawabanUser =
                        input.value.trim();

                }

            }


            if (
                jawabanUser === null
            ) {

                kosong++;

            }


            jawabanPengguna.push(
                jawabanUser
            );


            if (
                cekJawaban(
                    soal,
                    jawabanUser
                )
            ) {

                benar++;

            }

        }
    );


    const total =
        daftarSoal.length;


    const salah =
        total -
        benar -
        kosong;


    const nilai =
        Math.round(
            (benar / total) * 100
        );


    tampilkanHasilAkhir(
        benar,
        salah,
        kosong,
        nilai
    );

}


/* =====================================================
   CEK JAWABAN
===================================================== */

function cekJawaban(
    soal,
    jawabanUser
) {

    if (
        jawabanUser === null
    ) {

        return false;

    }


    if (
        soal.tipe === "pilihan"
    ) {

        return (
            jawabanUser ===
            soal.jawaban
        );

    }


    if (
        soal.tipe === "benar"
    ) {

        return (
            jawabanUser ===
            soal.jawaban
        );

    }


    if (
        soal.tipe === "isian"
    ) {

        return (
            normalisasi(
                jawabanUser
            ) ===
            normalisasi(
                soal.jawaban
            )
        );

    }


    return false;

}


/* =====================================================
   NORMALISASI
===================================================== */

function normalisasi(
    teks
) {

    return teks
        .toLowerCase()
        .replace(
            /[.,!?]/g,
            ""
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();

}


/* =====================================================
   HASIL AKHIR
===================================================== */

function tampilkanHasilAkhir(
    benar,
    salah,
    kosong,
    nilai
) {

    const hasilSoal =
        document.getElementById(
            "hasilSoal"
        );


    let html = `

        <div
            style="
                background:#e8f5e9;
                padding:20px;
                border-radius:10px;
                text-align:center;
            "
        >

            <h2>
                🎉 Latihan Selesai!
            </h2>

            <h1>
                ${nilai}
            </h1>

            <p>
                <strong>Nilai</strong>
            </p>

            <p>
                ✅ Benar: ${benar}
            </p>

            <p>
                ❌ Salah: ${salah}
            </p>

            <p>
                ⚪ Tidak dijawab: ${kosong}
            </p>

        </div>

        <hr>

        <h3>
            📖 Pembahasan
        </h3>

    `;


    daftarSoal.forEach(
        (
            soal,
            index
        ) => {

            const user =
                jawabanPengguna[
                    index
                ];


            const benarSoal =
                cekJawaban(
                    soal,
                    user
                );


            html += `

                <div
                    class="soal"
                    style="
                        border-left:5px solid
                        ${
                            benarSoal
                                ? "#4CAF50"
                                : "#f44336"
                        };
                    "
                >

                    <strong>
                        Soal ${index + 1}
                    </strong>

            `;


            if (
                benarSoal
            ) {

                html += `

                    <p class="jawaban-benar">

                        ✅ Jawaban kamu benar!

                    </p>

                `;

            }

            else {

                html += `

                    <p class="jawaban-salah">

                        ❌ Jawaban kamu salah.

                    </p>

                `;

            }


            html += `

                <p>

                    <strong>
                        Jawaban kamu:
                    </strong>

                    ${
                        user === null ||
                        user === ""
                            ? "Tidak dijawab"
                            : tampilkanJawaban(
                                soal,
                                user
                            )
                    }

                </p>

            `;


            if (
                !benarSoal
            ) {

                html += `

                    <p class="jawaban-benar">

                        <strong>
                            ✅ Jawaban yang benar:
                        </strong>

                        ${tampilkanJawabanBenar(
                            soal
                        )}

                    </p>


                    <p>

                        <strong>
                            💡 Pembahasan:
                        </strong>

                        ${soal.penjelasan}

                    </p>

                `;

            }


            html += `
                </div>
            `;

        }
    );


    html += `

        <button
            class="btn-soal"
            onclick="buatLatihanSoal()"
        >

            🔄 Kerjakan Lagi

        </button>

    `;


    hasilSoal.innerHTML =
        html;


    hasilSoal.style.display =
        "block";


    hasilSoal.scrollIntoView({
        behavior: "smooth"
    });

}


/* =====================================================
   TAMPILKAN JAWABAN PENGGUNA
===================================================== */

function tampilkanJawaban(
    soal,
    jawaban
) {

    if (
        soal.tipe === "pilihan"
    ) {

        return (

            String.fromCharCode(
                65 + jawaban
            ) +
            ". " +
            soal.pilihan[
                jawaban
            ]

        );

    }


    return jawaban;

}


/* =====================================================
   TAMPILKAN JAWABAN BENAR
===================================================== */

function tampilkanJawabanBenar(
    soal
) {

    if (
        soal.tipe === "pilihan"
    ) {

        return (

            String.fromCharCode(
                65 + soal.jawaban
            ) +
            ". " +
            soal.pilihan[
                soal.jawaban
            ]

        );

    }


    return soal.jawaban;

}


/* =====================================================
   AMBIL KATA PENTING
===================================================== */

function ambilKataPenting(
    kalimat
) {

    const kata =
        kalimat
            .split(/\s+/)
            .filter(
                k => k.length > 5
            );


    if (
        kata.length === 0
    ) {

        return kalimat
            .split(/\s+/)
            .slice(
                0,
                4
            )
            .join(" ");

    }


    return kata
        .slice(
            0,
            5
        )
        .join(" ");

}


/* =====================================================
   KAMERA
===================================================== */

async function bukaKamera() {

    const video =
        document.getElementById(
            "video"
        );


    try {

        streamKamera =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {
                        facingMode:
                            "environment"
                    },

                    audio: false

                });


        video.srcObject =
            streamKamera;


        video.style.display =
            "block";


        document.getElementById(
            "ambilFoto"
        ).style.display =
            "block";


        document.getElementById(
            "tutupKamera"
        ).style.display =
            "block";


    } catch (error) {

        alert(
            "Kamera tidak dapat dibuka. Pastikan izin kamera diberikan."
        );

    }

}


/* =====================================================
   AMBIL FOTO
===================================================== */

async function ambilGambar() {

    const video =
        document.getElementById(
            "video"
        );


    const canvas =
        document.getElementById(
            "canvas"
        );


    canvas.width =
        video.videoWidth;


    canvas.height =
        video.videoHeight;


    const context =
        canvas.getContext(
            "2d"
        );


    context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    canvas.toBlob(
        async function(blob) {

            const file =
                new File(
                    [blob],
                    "foto-kamera.jpg",
                    {
                        type:
                            "image/jpeg"
                    }
                );


            const input =
                document.getElementById(
                    "fileMateri"
                );


            const dataTransfer =
                new DataTransfer();


            dataTransfer.items.add(
                file
            );


            input.files =
                dataTransfer.files;


            document.getElementById(
                "namaFile"
            ).innerText =
                "📷 Foto dari kamera siap digunakan.";


            seluruhTeks = "";


            tutupKamera();


            alert(
                "Foto berhasil diambil. Sekarang kamu bisa merangkum materi atau membuat latihan soal."
            );

        },

        "image/jpeg",

        0.9

    );

}


/* =====================================================
   TUTUP KAMERA
===================================================== */

function tutupKamera() {

    const video =
        document.getElementById(
            "video"
        );


    if (
        streamKamera
    ) {

        streamKamera
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );


        streamKamera = null;

    }


    video.srcObject =
        null;


    video.style.display =
        "none";


    document.getElementById(
        "ambilFoto"
    ).style.display =
        "none";


    document.getElementById(
        "tutupKamera"
    ).style.display =
        "none";

}

</script>
